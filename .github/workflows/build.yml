name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32dev
          - esp32-s3-devkitc-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Cache ESPHome toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
          key: esphome-${{ runner.os }}-${{ hashFiles('requirements-build.txt', 'tests/build.yml') }}
          restore-keys: |
            esphome-${{ runner.os }}-

      - name: Build firmware
        run: make build BOARD=${{ matrix.board }}

      - name: Run native tests
        if: matrix.board == 'esp32-s3-devkitc-1'
        run: make test
