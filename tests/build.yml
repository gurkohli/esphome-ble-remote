substitutions:
  build_board: esp32-s3-devkitc-1

esphome:
  name: ble-hid-build-test
  build_flags:
    # ESP-IDF appends a general -Wno-error after user flags. The specific
    # diagnostic remains an error because specific warning options take
    # precedence over general ones regardless of their position.
    - -Werror=format

esp32:
  board: ${build_board}
  framework:
    type: esp-idf

logger:
  # Compile verbose-only logging calls so their printf arguments are checked.
  level: VERY_VERBOSE

wifi:
  ssid: build-test
  password: build-test-password

api:
  homeassistant_services: true

web_server:
  version: 3

external_components:
  - source:
      type: local
      path: ../components
    components: [ble_client_hid]

esp32_ble_tracker:

ble_client:
  - id: test_ble_client
    mac_address: "00:11:22:33:44:55"
  - id: second_test_ble_client
    mac_address: "00:11:22:33:44:66"

ble_client_hid:
  - id: test_ble_hid
    ble_client_id: test_ble_client
    event_sampling_interval: 500us
  - id: second_test_ble_hid
    ble_client_id: second_test_ble_client
    discovery_mode: forensic
    forensic_enable_web_logs: true
    protocol_mode: report
